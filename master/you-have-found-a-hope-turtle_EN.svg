    <text
       xml:space="preserve"
       style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-size:4.6987px;font-family:Mulish;-inkscape-font-specification:'Mulish Bold';letter-spacing:-0.165304px;writing-mode:lr-tb;direction:ltr;fill:#ff0000;stroke:none;stroke-width:0.889271"
       x="5.9012837"
       y="8.7218399"
       id="text2"><tspan
         sodipodi:role="line"
         id="tspan2"
         style="font-style:normal;font-variant:normal;font-weight:800;font-stretch:normal;font-family:Mulish;-inkscape-font-specification:'Mulish Ultra-Bold';letter-spacing:-0.165304px;fill:#ff0000;stroke:none;stroke-width:0.889271"
         x="5.9012837"
         y="8.7218399">You have found</tspan><tspan
         sodipodi:role="line"
         style="font-style:normal;font-variant:normal;font-weight:800;font-stretch:normal;font-family:Mulish;-inkscape-font-specification:'Mulish Ultra-Bold';letter-spacing:-0.165304px;fill:#ff0000;stroke:none;stroke-width:0.889271"
         x="5.9012837"
         y="14.595215"
         id="tspan30">a hope turtle</tspan></text>
    <text
       xml:space="preserve"
       transform="matrix(0.25007164,0,0,0.25007164,2.1054317,-18.003305)"
       id="text27"
       style="font-style:normal;font-variant:normal;font-weight:500;font-stretch:normal;font-size:10.8411px;font-family:Mulish;-inkscape-font-specification:'Mulish Medium';letter-spacing:0px;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect27);display:inline;fill:#000000;stroke:none;stroke-width:7.57039"><tspan
         x="15.226562"
         y="151.98587"
         id="tspan1">This isn't a drone.  Its what we call a </tspan><tspan
         x="15.226562"
         y="165.53725"
         id="tspan4">turtle!  It is a gift-- sent out of love by a </tspan><tspan
         x="15.226562"
         y="179.08863"
         id="tspan5">fellow human, to you.  The bottles </tspan><tspan
         x="15.226562"
         y="192.64"
         id="tspan6">contain dried food that should be good </tspan><tspan
         x="15.226562"
         y="206.19138"
         id="tspan7">at sea for weeks.  The turtle's wood </tspan><tspan
         x="15.226562"
         y="219.74276"
         id="tspan8">can be used to build bottle furniture </tspan><tspan
         x="15.226562"
         y="233.29413"
         id="tspan9">and structures.  You can keep the gift, </tspan><tspan
         x="15.226562"
         y="246.84551"
         id="tspan10">leave it, pass it on, or if you really </tspan><tspan
         x="15.226562"
         y="260.39689"
         id="tspan11">must... sink it-- just please be mindful </tspan><tspan
         x="15.226562"
         y="273.94825"
         id="tspan12">that the plastic bottles and electronics </tspan><tspan
         x="15.226562"
         y="287.49961"
         id="tspan13">are best kept out of the ocean so that </tspan><tspan
         x="15.226562"
         y="301.05097"
         id="tspan14">they don't cause problems for our </tspan><tspan
         x="15.226562"
         y="314.60233"
         id="tspan15">fellow creatures.    If you don't mind, </tspan><tspan
         x="15.226562"
         y="328.15369"
         id="tspan16">please register this turtle's arrival on </tspan><tspan
         x="15.226562"
         y="341.70505"
         id="tspan17">hopeturtles.org/report so that our </tspan><tspan
         x="15.226562"
         y="355.25641"
         id="tspan18">community can celebrate connecting </tspan><tspan
         x="15.226562"
         y="368.80777"
         id="tspan19">with you.</tspan></text>
