         id="text71"
         transform="matrix(1.3933776,0,0,1.3933776,106.07387,-6.6508632)"><tspan
           x="59.373726"
           y="18.74267"
           id="tspan21"><tspan
             dx="0 0.33060843 0.330607 0.33060819 0.33060867"
             id="tspan19">מצאתם</tspan><tspan
             dx="0.33060747 0.33060795 0.33060795 0.33060795"
             id="tspan20">מצב</tspan><tspan
             y="18.74267"
             id="tspan22"> </tspan></tspan><tspan
           x="59.373726"
           y="23.634164"
           id="tspan24"><tspan
             dx="0 0.33060867 0.33060771 0.33060747 0.33060747 0.33060843 0.330607 0.3306101 0.33060676"
             id="tspan23">תקווהצאתם</tspan></tspan></text>
    </g>
    <text
       xml:space="preserve"
       transform="matrix(0.25007164,0,0,0.25007164,1.4904711,-12.065961)"
       id="text109"
       style="font-style:normal;font-variant:normal;font-weight:500;font-stretch:normal;font-size:10.8411px;font-family:Mulish;-inkscape-font-specification:'Mulish Medium';text-align:end;letter-spacing:0px;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect109);display:inline;fill:#000000;stroke:none;stroke-width:7.57039"
       x="195.46982"
       y="0"><tspan
         x="22.626306"
         y="151.98587"
         id="tspan26"> <tspan
   dx="190.933"
   id="tspan25">מכילים מזון מיובש</tspan>, שאמור להישמר היטב </tspan><tspan
         x="210.69726"
         y="165.98207"
         id="tspan27">במשך שבועות בים. בעץ של הצב אפשר </tspan><tspan
         x="210.69727"
         y="179.97828"
         id="tspan28">להשתמש לבניית רהיטים ומבנים </tspan><tspan
         x="210.69727"
         y="193.97448"
         id="tspan29">מבקבוקים. אתם יכולים לשמור את </tspan><tspan
         x="210.69727"
         y="207.97068"
         id="tspan30">המתנה, להשאיר אותה במקומה, להעביר </tspan><tspan
         x="210.69726"
         y="221.96688"
         id="tspan31">אותה הלאה, או, אם אתם ממש חייבים... </tspan><tspan
         x="210.69726"
         y="235.96308"
         id="tspan32">להטביע אותה — רק בבקשה זכרו שעדיף </tspan><tspan
         x="210.69726"
         y="249.95928"
         id="tspan33">להרחיק את בקבוקי הפלסטיק ואת </tspan><tspan
         x="210.69726"
         y="263.95548"
         id="tspan34">הרכיבים האלקטרוניים מהים, כדי שלא </tspan><tspan
         x="210.69727"
         y="277.95166"
         id="tspan35">יפגעו ביצורים האחרים שחולקים איתנו את </tspan><tspan
         x="210.69727"
         y="291.94785"
         id="tspan36">העולם. אם לא אכפת לכם, אנא דווחו על </tspan><tspan
         x="210.69727"
         y="305.94403"
         id="tspan38">הגעתו של הצב הזה באתר<tspan
   dx="108.26278"
   id="tspan37"> </tspan></tspan><tspan
         x="35.157068"
         y="319.94022"
         id="tspan40">hopeturtles.org/report <tspan
   dx="68.452141"
   id="tspan39">כדי שהקהילה </tspan></tspan><tspan
         x="208.14962"
         y="333.93641"
         id="tspan42">שלנו תוכל לחגוג את הקשר שנוצר איתכם<tspan
   dx="174.72803"
   id="tspan41">.</tspan></tspan></text>
  </g>
