           id="tspan2"><tspan
             dx="0 0.33060867 0.33060628 0.33060962 0.33060795 0.33060771 0.33060879 0.33060676 0.33060819 0.33060771"
             id="tspan1">عثرتم على</tspan><tspan
             y="18.74267"
             id="tspan3"> </tspan></tspan><tspan
           x="59.373726"
           y="23.634164"
           id="tspan5"><tspan
             dx="0 0.33060914 0.33060628 0.33060819 0.33060867 0.33060795 0.330607 0.33060879 0.33060771 0.33060747"
             id="tspan4">سلحفاة أمل</tspan></tspan></text>
    </g>
    <text
       xml:space="preserve"
       transform="matrix(0.25007164,0,0,0.25007164,1.4904711,-12.065961)"
       id="text109"
       style="font-style:normal;font-variant:normal;font-weight:500;font-stretch:normal;font-size:11.2857px;font-family:Mulish;-inkscape-font-specification:'Mulish Medium';text-align:end;letter-spacing:0px;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect109);display:inline;fill:#000000;stroke:none;stroke-width:7.57039"
       x="195.46982"
       y="0"><tspan
         x="41.810339"
         y="152.39748"
         id="tspan7"> <tspan
   dx="171.86636"
   id="tspan6">طعام مجفّف يُفترض أن يبقى صالحًا </tspan></tspan><tspan
         x="210.69727"
         y="166.96767"
         id="tspan8">للأكل لأسابيع في البحر. ويمكن استخدام </tspan><tspan
         x="210.69727"
         y="181.53786"
         id="tspan9">خشب السلحفاة لصنع أثاث ومنشآت من </tspan><tspan
         x="210.69726"
         y="196.10805"
         id="tspan10">الزجاجات. يمكنكم الاحتفاظ بالهدية، أو </tspan><tspan
         x="210.69727"
         y="210.67825"
         id="tspan11">تركها في مكانها، أو إهداؤها لشخص آخر، </tspan><tspan
         x="210.69727"
         y="225.24844"
         id="tspan12">أو، إن اضطررتم حقًا... إغراقها — لكن </tspan><tspan
         x="210.69727"
         y="239.81863"
         id="tspan13">نرجوكم أن تتذكّروا أن من الأفضل إبقاء </tspan><tspan
         x="210.69726"
         y="254.38882"
         id="tspan14">الزجاجات البلاستيكية والمكوّنات </tspan><tspan
         x="210.69727"
         y="268.95901"
         id="tspan15">الإلكترونية خارج البحر، حتى لا تؤذي </tspan><tspan
         x="210.69726"
         y="283.5292"
         id="tspan16">الكائنات الأخرى التي تشاركنا هذا العالم. </tspan><tspan
         x="210.69727"
         y="298.09939"
         id="tspan17">إذا لم يكن لديكم مانع، يُرجى تسجيل </tspan><tspan
         x="210.69727"
         y="312.66958"
         id="tspan19">وصول هذه السلحفاة على<tspan
   dx="101.40046"
   id="tspan18"> </tspan></tspan><tspan
         x="41.988034"
         y="327.23977"
         id="tspan21">hopeturtles.org/report <tspan
   dx="57.229424"
   id="tspan20">حتى يتمكّن </tspan></tspan><tspan
         x="208.04514"
         y="341.80996"
         id="tspan23">مجتمعنا من الاحتفال بهذا التواصل معكم<tspan
   dx="170.11211"
   id="tspan22">.</tspan></tspan></text>
  </g>
